<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Watchlist</title>
</head>

<body>
    <main>
        <div class="hero">
            <div class="menu container">
                <a href="index.html">
                    <h1 class="title">Find your film</h1>
                </a>
                <a class="watchlist-page" href="index.html">
                    <p>Search for movies</p>
                </a>
            </div>
        </div>
        <div id="explore" class="explore"> <!--class = "disabled" to hide if not empty-->
            <div class="start-explore">
                <p id="message">Your watchlist is looking a little empty...</p>
                <a class="add-some" href="index.html">
                    <svg class="add-icon" width="16" height="16" viewBox="0 0 16 16" fill="none"
                        xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path
                            d="M8 16C12.4183 16 16 12.4183 16 8C16 3.58172 12.4183 0 8 0C3.58172 0 0 3.58172 0 8C0 12.4183 3.58172 16 8 16ZM9 5C9 4.44772 8.55228 4 8 4C7.44772 4 7 4.44772 7 5V7H5C4.44772 7 4 7.44771 4 8C4 8.55228 4.44772 9 5 9H7V11C7 11.5523 7.44772 12 8 12C8.55228 12 9 11.5523 9 11V9H11C11.5523 9 12 8.55228 12 8C12 7.44772 11.5523 7 11 7H9V5Z"
                            fill-rule="evenodd" clip-rule="evenodd" fill="white" />
                    </svg>
                    Let’s add some movies!
                </a>
            </div>
        </div>
        <div id="loader" class="disabled" role="status" aria-live="polite"> <!--class = "loader" to show-->
            <div class="loader-content">
                <div class="loader__spinner"></div>
            </div>

        </div>
        <div id="result" class="disabled"></div> <!--class = "result" to show my added watch list-->
    </main>
    <script src="watchlist.js"></script>
</body>

</html>
