<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Movie Watchlist</title>
</head>

<body>
    <main>
        <div class="hero">
            <div class="menu container">
                <h1 class="title">Find your film</h1>
                <a class="watchlist-page" href="">
                    <p>My Watchlist</p>
                </a>
            </div>
            <form id="search" class="search" role="search">
                <label class="search__field">
                    <svg class="search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                        stroke-linecap="round" aria-hidden="true">
                        <circle cx="10" cy="10" r="6.5" />
                        <path d="M15 15l6 6" />
                    </svg>
                    <input id="search-input" class="search__input" type="search" name="q" placeholder="..."
                        aria-label="Search">
                </label>
                <button class="search__button" type="submit">Search</button>
            </form>
        </div>
        <div class="disabled">
            <div class="start-explore">
                <svg class="movie-icon" width="70" height="62" viewBox="0 0 70 62" fill="none"
                    xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M8.75 0C3.91751 0 0 3.9175 0 8.75V52.5C0 57.3325 3.91751 61.25 8.75 61.25H61.25C66.0825 61.25 70 57.3325 70 52.5V8.75C70 3.9175 66.0825 0 61.25 0H8.75ZM21.875 8.75H48.125V26.25H21.875V8.75ZM56.875 43.75V52.5H61.25V43.75H56.875ZM48.125 35H21.875V52.5H48.125V35ZM56.875 35H61.25V26.25H56.875V35ZM61.25 17.5V8.75H56.875V17.5H61.25ZM13.125 8.75V17.5H8.75V8.75H13.125ZM13.125 26.25H8.75V35H13.125V26.25ZM8.75 43.75H13.125V52.5H8.75V43.75Z"
                        fill-rule="evenodd" clip-rule="evenodd" fill="#2E2E2F" />
                </svg>
                <p>Start exploring</p>
            </div>
        </div>
        <div id="result" class="result">
            <div class="moive-box container">
                <img class="movie-image" src="images/hero.png" alt="">
                <div class="movie-info">
                    <div class="movie">
                        <h2>TITLE</h2>
                        <svg width="12" height="11" viewBox="0 0 12 11" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M4.86276 0.518241C5.08727 -0.172742 6.06483 -0.172743 6.28934 0.51824L7.09152 2.98709C7.19193 3.2961 7.47989 3.50532 7.80481 3.50532H10.4007C11.1273 3.50532 11.4293 4.43504 10.8416 4.86209L8.74142 6.38792C8.47856 6.5789 8.36856 6.91743 8.46897 7.22644L9.27115 9.69529C9.49566 10.3863 8.7048 10.9609 8.11702 10.5338L6.01689 9.00799C5.75402 8.817 5.39808 8.817 5.13521 9.00799L3.03508 10.5338C2.4473 10.9609 1.65644 10.3863 1.88095 9.69529L2.68313 7.22645C2.78354 6.91743 2.67354 6.5789 2.41068 6.38792L0.31055 4.86209C-0.277235 4.43504 0.0248458 3.50532 0.751388 3.50532H3.34729C3.67221 3.50532 3.96017 3.2961 4.06058 2.98709L4.86276 0.518241Z"
                                fill="#FEC654" />
                        </svg>
                        <p class="mini-text">RATE</p>
                    </div>
                    <div class="tags">
                        <p class="mini-text">DURATION</p>
                        <p class="mini-text">CATIGORY</p>
                        <button id="watchlist-btn" class="watchlist-btn">
                            <svg class="add-icon" width="16" height="16" viewBox="0 0 16 16" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path
                                    d="M8 16C12.4183 16 16 12.4183 16 8C16 3.58172 12.4183 0 8 0C3.58172 0 0 3.58172 0 8C0 12.4183 3.58172 16 8 16ZM9 5C9 4.44772 8.55228 4 8 4C7.44772 4 7 4.44772 7 5V7H5C4.44772 7 4 7.44771 4 8C4 8.55228 4.44772 9 5 9H7V11C7 11.5523 7.44772 12 8 12C8.55228 12 9 11.5523 9 11V9H11C11.5523 9 12 8.55228 12 8C12 7.44772 11.5523 7 11 7H9V5Z"
                                    fill-rule="evenodd" clip-rule="evenodd" fill="white" />
                            </svg>
                            Watchlist
                        </button>
                    </div>
                    <p class="description">aljng wfkjsdflkjs iwpejfksjdlkfsd wieflkdhfljshgljshgsefoishbs
                        esiofhsdklhfsgsighg
                        sefihsdfishdfisi

                        sefihsdfishdfisi
                    </p>
                </div>

            </div>

        </div>
    </main>
    <script src="index.js"></script>
</body>

</html>
