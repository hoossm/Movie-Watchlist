<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Movie Watchlist</title>
</head>

<body>
    <main>
        <div class="hero">
            <div class="menu container">
                <h1 class="title">Find your film</h1>
                <a class="watchlist-page" href="">
                    <p>My Watchlist</p>
                </a>
            </div>
            <form class="search" role="search">
                <label class="search__field">
                    <svg class="search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                        stroke-linecap="round" aria-hidden="true">
                        <circle cx="10" cy="10" r="6.5" />
                        <path d="M15 15l6 6" />
                    </svg>
                    <input class="search__input" type="search" name="q" placeholder="..." aria-label="Search">
                </label>
                <button class="search__button" type="submit">Search</button>
            </form>
        </div>
        <div class="explore">

        </div>
    </main>
    <script src="index.js"></script>
</body>

</html>
