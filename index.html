<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Movie Watchlist</title>
</head>

<body>
    <main>
        <div class="hero">
            <div class="menu container">
                <a href="index.html">
                    <h1 class="title">Find your film</h1>
                </a>
                <a class="watchlist-page" href="">
                    <p>My Watchlist</p>
                </a>
            </div>
            <form id="search" class="search" role="search">
                <label class="search__field">
                    <svg class="search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                        stroke-linecap="round" aria-hidden="true">
                        <circle cx="10" cy="10" r="6.5" />
                        <path d="M15 15l6 6" />
                    </svg>
                    <input id="search-input" class="search__input" type="search" name="q" placeholder="Search Movie"
                        aria-label="Search">
                </label>
                <button class="search__button" type="submit">Search</button>
            </form>
        </div>
        <div id="explore" class="explore"> <!--class = "disabled" to hide-->
            <div class="start-explore">
                <svg class="movie-icon" width="70" height="62" viewBox="0 0 70 62" fill="none"
                    xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M8.75 0C3.91751 0 0 3.9175 0 8.75V52.5C0 57.3325 3.91751 61.25 8.75 61.25H61.25C66.0825 61.25 70 57.3325 70 52.5V8.75C70 3.9175 66.0825 0 61.25 0H8.75ZM21.875 8.75H48.125V26.25H21.875V8.75ZM56.875 43.75V52.5H61.25V43.75H56.875ZM48.125 35H21.875V52.5H48.125V35ZM56.875 35H61.25V26.25H56.875V35ZM61.25 17.5V8.75H56.875V17.5H61.25ZM13.125 8.75V17.5H8.75V8.75H13.125ZM13.125 26.25H8.75V35H13.125V26.25ZM8.75 43.75H13.125V52.5H8.75V43.75Z"
                        fill-rule="evenodd" clip-rule="evenodd" fill="#2E2E2F" />
                </svg>
                <p id="message">Start exploring</p>
            </div>
        </div>
        <div id="loader" class="disabled" role="status" aria-live="polite"> <!--class = "loader" to show-->
            <div class="loader-content">
                <div class="loader__spinner"></div>
            </div>

        </div>
        <div id="result" class="disabled"></div> <!--class = "result" to show-->
    </main>
    <script src="index.js"></script>
</body>

</html>
